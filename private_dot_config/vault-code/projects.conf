# Projections of code documentation into the Obsidian vault.
#
#   <vault path> | <source repo> | <subdir>[=<link name>][,<subdir>[=<link name>]…]
#
# The vault path is relative to the vault root and holds ONLY links this tool
# owns; personal notes for a project live in its parent directory, beside it.
#
# Link names must not start with a dot — Obsidian hides those, which would defeat
# the whole point for `.claude/plans`. Hence the explicit `=Plans` renames.
#
# One manifest for every host. An entry whose source is absent here is skipped,
# and its projection removed, so gaia and athena share this file unchanged.
#
# Sources are declared, never auto-elected: two checkouts of one repo on two
# machines are a VCS divergence, and the vault must not paper over it.

# --- Tyrex ------------------------------------------------------------------
Projets/Tyrex/T-Scanner/Code | ~/code/tyrex/t-scanner | .claude/plans=Plans,.claude/brainstorm=Brainstorm,.claude/debug=Debug,docs=Docs
Projets/Tyrex/T-Gate/Code    | ~/code/tyrex/t-gate    | .claude/plans=Plans,docs=Docs
Projets/Tyrex/Cerberus/Code  | ~/code/tyrex/cerberus  | .claude/plans=Plans,docs=Docs
Projets/Tyrex/Melusine/Code  | ~/code/tyrex/melusine  | .claude/plans=Plans,docs=Docs

# --- Perso ------------------------------------------------------------------
Projets/Astro-Hibou/Code     | ~/code/astro-hibou     | .claude/plans=Plans,.claude/brainstorm=Brainstorm,docs=Docs
Projets/Meteo-Station/Code   | ~/code/meteo_station   | .claude/plans=Plans,.claude/brainstorm=Brainstorm,docs=Docs

# Forced inclusions — detection cannot reach these on its own:
#   keysas is mine, but its remote still points at the upstream keysas-fr org.
#   Uncomment once it has documentation worth surfacing.
# Projets/Keysas/Code        | ~/code/keysas          | .claude/plans=Plans,docs=Docs

# ~/Projets is deliberately absent: its organisation is not settled, so nothing
# there is projected automatically. Add entries by hand as it stabilises.

# --- Tyrex crates ------------------------------------------------------------
